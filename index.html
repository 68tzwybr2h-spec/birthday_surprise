<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday ❤️</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffd6e7, #fff0f5);
      font-family: Arial, sans-serif;
      text-align: center;
      color: #6b2148;
    }

    .box {
      background: white;
      padding: 50px 30px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      max-width: 500px;
    }

    h1 {
      font-size: 42px;
    }

    p {
      font-size: 20px;
      line-height: 1.6;
    }

    button {
      background: #e75480;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #c93d68;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Happy Birthday, My Love ❤️</h1>

    <p>
      Today is a very special day because it's the day you were born. 🎂
    </p>

    <p>
      I made something special just for you... 💌
    </p>

    <button onclick="alert('This is only the beginning... ❤️')">
      Click me 💕
    </button>
  </div>

</body>
</html>
