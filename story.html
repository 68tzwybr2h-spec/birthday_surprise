<!DOCTYPE html>
<html>
<head>

  <style>

    h1 {

    }

    .memory {
      margin: 30px 0;
      padding: 20px;
      border-radius: 20px;

      color: #e75480;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
    }

    button {
      background: #e75480;
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 25px;
      font-size: 17px;
      cursor: pointer;

<body>
