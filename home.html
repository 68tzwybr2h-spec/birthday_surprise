<!DOCTYPE html>
<html>
<head>
  <title>For My Love ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffd6e7, #fff0f5);
      font-family: Arial, sans-serif;
      text-align: center;
      color: #6b2148;
    }

    .box {
      background: white;
      padding: 45px 30px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      width: 500px;
      max-width: 80%;
    }

    h1 {
      font-size: 38px;
      color: #e75480;
    }

    p {
      font-size: 19px;
      line-height: 1.7;
    }

    button {
      background: #e75480;
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 25px;
      font-size: 17px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>For My Love ❤️</h1>

    <p>
      I made something special for you...
    </p>

    <p>
      A little journey through our story, our memories,
      and all the love I have for you. 💕
    </p>

    <p>
      Are you ready?
    </p>

    <button onclick="window.location.href='index.html'">
      Start Our Story ❤️
    </button>

  </div>

</body>
</html>
