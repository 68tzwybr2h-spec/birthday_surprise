<!DOCTYPE html>
<html>
<head>
  <title>For You ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffd6e7, #fff0f5);
      font-family: Arial, sans-serif;
      text-align: center;
      color: #6b2148;
    }

    .box {
      background: white;
      padding: 45px 30px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      width: 420px;
      max-width: 80%;
    }

    h1 {
      font-size: 35px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    input {
      padding: 14px;
      width: 80%;
      border: 2px solid #e75480;
      border-radius: 25px;
      font-size: 16px;
      text-align: center;
      margin: 15px 0;
    }

    button {
      background: #e75480;
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 25px;
      font-size: 17px;
      cursor: pointer;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🔐 A Little Secret</h1>

    <p>
      This website is only for one special person... ❤️
    </p>

    <p>
      Enter the secret password to continue 💌
    </p>

    <input type="password" id="password" placeholder="Enter password">

    <br>

    <button onclick="checkPassword()">Open ❤️</button>

    <div id="message"></div>
  </div>

  <script>
    function checkPassword() {
      const password = document.getElementById("password").value;

      if (password === "1234") {
        window.location.href = "birthday.html";
      } else {
        document.getElementById("message").innerHTML =
          "Wrong password 😏 Try again ❤️";
      }
    }
  </script>

</body>
</html>
